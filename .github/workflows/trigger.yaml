name: Trigger Main Terraform Workflow

on:
  push:
    branches:
      - main   
    paths:
      - '**.tf'
      - '**.tfvars'

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Terraform Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/Dope/dispatches \
            -d '{
              "event_type": "terraform-trigger",
              "client_payload": {
                "repository": "${{ github.event.repository.name }}",
                "action": "plan"
              }
            }
